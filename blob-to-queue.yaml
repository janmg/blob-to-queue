## GENERIC CONFIG
# if fsnotify is set to true at the start of the program, changes will take affect on save on a running instance, if the program started without or set to false the program must be restarted to take affect
fsnotify: true

# loglevel 0 is silent, 1 is medium, 2 is a lot, 3 is overkill
loglevel: 1
logFile: /var/log/blob-to-queue.log

DebugLevel: 2
DebugUntil: 10000
DebugTime: false

## INPUT CONFIG
# read from blob storage, default format is "json",
# TODO implement jsonlines, csv, line, regexp parser when everything else works. This program is initially for nsgflowlog parsing.
#accountName: "janmg"
#accountKey: "amFubWcK"
#cloud: "blob.core.windows.net"
connection: "DefaultEndpointsProtocol=https;AccountName=janmgblobtoqueue;AccountKey=amFubWcK;EndpointSuffix=core.windows.net"
containerName: "insights-logs-flowlogflowevent"
type: "vnetflowlog" # nsgflowlog
format: "json" # "json_lines","lines","raw"
interval: 60

startpolicy: "resume"
# "resume"/ "start_over" / "start_fresh"
resumepolicy: "timestamp"
# "timestamp" / "registry"
timestamp: "timestamp"
registry: "registry.dat"
# registry_path, :validate => :string, :required => false, :default => 'data/registry.dat'
# registry_local_path, :validate => :string, :required => false


## FILTER CONFIG
path_prefix: "/SUBSCRIPTIONS/093F2264-2117-475A-8FF0-AE720ACFB36B_NETWORKWATCHERRG/NETWORKWATCHER_SWEDENCENTRAL_VNET-SWEDENCENTRAL-VM-FLOWLOG"
# /y=2025/m=12/d=25/h=06/m=00/macAddress=7CED8D3F0C44/PT1H.json
path_include: ['PT1H.json']
path_filter: ["**/*.json"]

# Input type and file filters
# logtype, :validate => ['nsgflowlog','vnetflowlog','wadiis','appservice','raw'], :default => 'raw'
# prefix, :validate => :string, :required => false
# path_filters, :validate => :array, :default => ['**/*'], :required => false
# interval, :validate => :number, :default => 60

# Because golang does not support "infinite" channels, we set a maximum size for the queue. The watermark is the size until we stop reading in more data, the difference between qsize and qwatermark should be the amount of events that can be stored in a single file.
qsize: 20000
qwatermark: 18000
# TODO: switch to percentage

## OUTPUT CONFIG
# The formatter can output as original "line", as "csv"
# setting an output will enable the output immediately after saving the file, because fsnotify will read the changes and apply them on the fly.
# format can be csv, flat, ecs, avro

# Bit of a hack, but I don't know how to deal with multiple outputs
output: ["stdout","file","summary","elasticsearch","eventhub","kafka","ampq","mqtt","keyval"]
# Add details
addfilename: false
environment: "dev"

# output to stdout
stdout:
  format: "csv"

# output to file
file:
  filename: "./nsg.log"
  format: "csv"
#TODO: Should there be an RFC 5424 rsyslog over network option?

#summary to file
summary:
  filename: "./nsg-summary.log"
  udp_timeout: 120
  #?? what does UDP have to do with files? Should this be an interval in which stats are written to the summary file?

# output to azure eventhub
eventhub:
  #Event Hubs Namespace / Shared access policies: RootManageSharedAccessKey
  # not in the entities, and create a new "send" policy
  connection: "Endpoint=sb://nsgflowlogs.servicebus.windows.net/;SharedAccessKeyName=nsgflowlogs;SharedAccessKey=yq6a9A="
  #connection: "Endpoint=sb://nsgflowlogs.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=pVYkhJMJzJw="
  format: "csv"

# output to kafka
kafka:
  connection: "localhost:9096"
  format: "json"

# output to ampq
ampq:
  connection: "ampq://localhost:1234"
  format: "json"

# output to mqtt
mqtt:
  connection: "https://localhost"
  format: "json"
  topic: "/logs/nsg"

# output to elasticsearch
elasticsearch:
  connection: "https://10.0.0.230:9200"
  token: "AAEAAWVsYXRmEtblE"
  format: "ecs"
  details: ["elastic_ca.crt","vnet", "1w"]
  # serviceToken, index, interval
 